<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игра в разработке</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #12121a;
    color: #f2f2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 460px; }
  .icon { font-size: 64px; margin-bottom: 12px; }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 8vw, 42px); }
  p { margin: 0 0 24px; font-size: 18px; line-height: 1.5; color: #a7a7b8; }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    background: #7c5cff;
    color: #fff;
    border-radius: 10px;
    font-weight: 600;
    font-size: 17px;
    text-decoration: none;
    transition: background .2s;
  }
  .btn:hover { background: #6a49f0; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="icon">🎮</div>
    <h1>Игра в разработке</h1>
    <p>Здесь скоро появится игра. Заходите позже.</p>
    <a class="btn" href="https://t.me/ArtemLilpip" target="_blank" rel="noopener">Написать в Telegram</a>
  </main>
</body>
</html>
