<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Технические работы</title>
<style>
  :root {
    --bg: #07060f;
    --text-dim: #9a98b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
    padding: 24px;
  }

  /* Плавающие цветные пятна на фоне */
  .blob {
    position: fixed;
    width: 46vmax;
    height: 46vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .38;
    z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .b1 { background: #ff2d75; top: -18vmax; left: -12vmax; }
  .b2 { background: #2d7dff; bottom: -20vmax; right: -14vmax; animation-delay: -6s; }
  .b3 { background: #27e0a3; top: 30%; left: 55%; width: 30vmax; height: 30vmax; animation-delay: -11s; opacity: .22; }
  @keyframes drift {
    to { transform: translate(8vmax, 6vmax) scale(1.18) rotate(40deg); }
  }

  main { position: relative; z-index: 1; max-width: 880px; }

  /* Радужный переливающийся текст */
  .rainbow {
    background: linear-gradient(90deg,
      #ff3b3b, #ff9f1c, #ffe74c, #2ee59d, #2db7ff, #7b5cff, #ff4fd8, #ff3b3b);
    background-size: 300% 100%;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    animation: flow 6s linear infinite;
  }
  @keyframes flow {
    to { background-position: -300% 0; }
  }

  h1 {
    font-size: clamp(2.4rem, 8.5vw, 6rem);
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.05;
    filter: drop-shadow(0 0 22px rgba(160, 110, 255, .45));
    animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both, glow 4s ease-in-out 1.2s infinite alternate;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(28px) scale(.96); filter: blur(10px); }
  }
  @keyframes glow {
    to { filter: drop-shadow(0 0 38px rgba(255, 90, 200, .6)); }
  }

  p.sub {
    margin-top: 22px;
    font-size: clamp(1.05rem, 2.6vw, 1.4rem);
    color: var(--text-dim);
    line-height: 1.55;
    animation: rise 1.2s .25s cubic-bezier(.2,.8,.2,1) both;
  }

  /* Шестерёнки */
  .gears {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-bottom: 30px;
    animation: rise 1s cubic-bezier(.2,.8,.2,1) both;
  }
  .gear { width: 74px; height: 74px; fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .gear.big   { width: 96px; height: 96px; stroke: url(#g1); animation: spin 9s linear infinite; }
  .gear.small { stroke: url(#g2); margin-top: 38px; animation: spin 6s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Радужная полоса загрузки */
  .bar {
    width: min(420px, 78vw);
    height: 8px;
    margin: 38px auto 0;
    border-radius: 99px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
    animation: rise 1.2s .45s both;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 45%;
    border-radius: 99px;
    background: linear-gradient(90deg, #ff3b3b, #ff9f1c, #ffe74c, #2ee59d, #2db7ff, #7b5cff, #ff4fd8);
    background-size: 220% 100%;
    animation: slide 1.9s ease-in-out infinite, flow2 3s linear infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(260%); }
  }
  @keyframes flow2 { to { background-position: -220% 0; } }

  .note {
    margin-top: 26px;
    font-size: 1.05rem;
    font-weight: 600;
    animation: rise 1.2s .6s both;
  }

  /* Парящие светлячки */
  .dots span {
    position: fixed;
    bottom: -12px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: hsl(var(--h) 100% 70%);
    box-shadow: 0 0 12px hsl(var(--h) 100% 65%);
    z-index: 0;
    animation: float var(--d) linear infinite;
    animation-delay: var(--delay);
    left: var(--x);
  }
  @keyframes float {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) translateX(40px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .rainbow { background-position: 0 0; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="dots" aria-hidden="true">
    <span style="--x:6%;  --h:330; --d:11s; --delay:-2s"></span>
    <span style="--x:16%; --h:200; --d:14s; --delay:-7s"></span>
    <span style="--x:28%; --h:50;  --d:10s; --delay:-4s"></span>
    <span style="--x:41%; --h:150; --d:13s; --delay:-9s"></span>
    <span style="--x:53%; --h:280; --d:12s; --delay:-1s"></span>
    <span style="--x:64%; --h:20;  --d:15s; --delay:-6s"></span>
    <span style="--x:76%; --h:180; --d:11s; --delay:-3s"></span>
    <span style="--x:87%; --h:310; --d:13s; --delay:-8s"></span>
    <span style="--x:94%; --h:90;  --d:10s; --delay:-5s"></span>
  </div>

  <main>
    <div class="gears" aria-hidden="true">
      <svg class="gear big" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff4fd8"/><stop offset="1" stop-color="#2db7ff"/>
          </linearGradient>
          <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#ffe74c"/><stop offset="1" stop-color="#2ee59d"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="15"/>
        <path d="M50 8v12M50 80v12M8 50h12M80 50h12M20.3 20.3l8.5 8.5M71.2 71.2l8.5 8.5M79.7 20.3l-8.5 8.5M28.8 71.2l-8.5 8.5"/>
        <circle cx="50" cy="50" r="30"/>
      </svg>
      <svg class="gear small" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="12"/>
        <path d="M50 10v12M50 78v12M10 50h12M78 50h12M21.7 21.7l8.5 8.5M69.8 69.8l8.5 8.5M78.3 21.7l-8.5 8.5M30.2 69.8l-8.5 8.5"/>
        <circle cx="50" cy="50" r="28"/>
      </svg>
    </div>

    <h1 class="rainbow">Технические работы</h1>

    <p class="sub">Мы немного обновляем сайт, чтобы он стал лучше.<br>Скоро всё заработает — загляните чуть позже.</p>

    <div class="bar" aria-hidden="true"><i></i></div>

    <p class="note rainbow">Спасибо, что вы с нами!</p>
  </main>
</body>
</html>
