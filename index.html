<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игра в разработке</title>
<style>
  :root {
    --bg: #1b2430;
    --brass: #b08d57;
    --steel: #5f7a8a;
    --text: #f1e9d8;
    --muted: #a9b4bf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    overflow: hidden;
  }
  .gear { position: fixed; display: block; z-index: 0; animation: spin 24s linear infinite; }
  .g1 { width: 300px; height: 300px; top: -110px; left: -110px; color: var(--brass); }
  .g2 { width: 190px; height: 190px; top: 120px; left: 120px; color: var(--steel); animation-direction: reverse; animation-duration: 15s; }
  .g3 { width: 260px; height: 260px; bottom: -90px; right: -90px; color: var(--steel); animation-duration: 30s; }
  .g4 { width: 150px; height: 150px; bottom: 100px; right: 130px; color: var(--brass); animation-direction: reverse; animation-duration: 19s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { position: relative; z-index: 1; max-width: 460px; }
  h1 { margin: 0 0 14px; font-size: clamp(32px, 8vw, 46px); font-weight: 700; letter-spacing: .5px; }
  p { margin: 0; font-size: 19px; line-height: 1.55; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .gear { animation: none; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="gear" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="10" stroke-dasharray="9.948 9.948"/>
      <circle cx="50" cy="50" r="34" fill="currentColor"/>
      <circle cx="50" cy="50" r="24" fill="none" stroke="var(--bg)" stroke-width="3"/>
      <circle cx="50" cy="50" r="10" fill="var(--bg)"/>
    </symbol>
  </svg>

  <svg class="gear g1" aria-hidden="true"><use href="#gear"/></svg>
  <svg class="gear g2" aria-hidden="true"><use href="#gear"/></svg>
  <svg class="gear g3" aria-hidden="true"><use href="#gear"/></svg>
  <svg class="gear g4" aria-hidden="true"><use href="#gear"/></svg>

  <main>
    <h1>Игра в разработке</h1>
    <p>Механизм ещё собирается. Загляните сюда позже.</p>
  </main>
</body>
</html>
